# Sirve la SPA en el puerto 3000, que es el que esperan el grupo del frontend
# y su health check. Las rutas de la API no llegan aquí: el balanceador las
# manda al grupo de la API antes.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Los assets llevan hash en el nombre: se pueden cachear sin límite.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html no se cachea, para que una imagen nueva se vea al recargar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
