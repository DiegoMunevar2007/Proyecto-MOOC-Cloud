name: Verificación entrega 3
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mooc_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Pruebas, integración y cobertura
        working-directory: backend
        env:
          POSTGRES_TEST_DSN: host=localhost user=postgres password=test-only dbname=mooc_test port=5432 sslmode=disable
          REDIS_TEST_ADDR: localhost:6379
        run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependencias del navegador
        run: |
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Medio sintético del recorrido
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p capacity-planning/media
          ffmpeg -y -loglevel error -f lavfi -i testsrc=size=854x480:rate=24:duration=30 -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest capacity-planning/media/p1-small.mp4
      - name: Levantar aplicación local
        run: |
          cp .env.example .env
          docker compose -p mooc-local -f docker-compose.yml -f compose.dev.yml build backend worker
          docker compose -p mooc-local -f docker-compose.yml -f compose.dev.yml up -d --wait --wait-timeout 600
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5180/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Autoría, procesamiento, inscripción, progreso y evaluación
        run: python3 scripts/test_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots-${{ github.sha }}
          # Los traces contienen sesiones y URLs firmadas; no se publican.
          path: frontend/test-results/**/*.png
          retention-days: 30
      - name: Detener aplicación local del runner
        if: always()
        run: docker compose -p mooc-local -f docker-compose.yml -f compose.dev.yml down
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
      - working-directory: scripts/IaC
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate
          terraform test
  quality:
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 25
    env:
      SONAR_HOST_URL: http://localhost:19090
      SONAR_PROJECT_KEY: mooc-cloud
      SONAR_ENV_FILE: /tmp/mooc-sonar.env
      SONAR_IMAGE: sonarqube:community@sha256:aa0d41212704d1ed35f7ae3b49886b39f639590baf8020cdb191c2a2eb8f9eae
      SCANNER_IMAGE: sonarsource/sonar-scanner-cli:latest@sha256:47956b669bf486bdad919e1cbd0533223515aa0b6d1d31763e5a3754942df6d7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: go-coverage
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && cd frontend && pnpm install --frozen-lockfile
      - name: SonarQube efímero en el runner, sin recursos cloud
        run: |
          sudo sysctl -w vm.max_map_count=524288
          docker run -d --name mooc-sonar -p 127.0.0.1:19090:9000 "$SONAR_IMAGE"
          python3 scripts/quality/sonar.py bootstrap
      - name: Analizar todo el código
        run: |
          set -a
          source "$SONAR_ENV_FILE"
          set +a
          mkdir -p .scannerwork
          chmod 777 .scannerwork
          docker run --rm --network host -e SONAR_HOST_URL -e SONAR_TOKEN -v "$PWD:/usr/src" "$SCANNER_IMAGE" -Dsonar.scm.revision="$(git rev-parse HEAD)" -Dsonar.working.directory=/usr/src/.scannerwork -Dsonar.scanner.skipJreProvisioning=true
      - name: Exportar reporte completo y verificar umbrales totales
        run: |
          set -a
          source "$SONAR_ENV_FILE"
          set +a
          python3 scripts/quality/sonar.py export
      - name: Registrar versiones de imágenes y logs
        if: always()
        run: |
          mkdir -p artifacts/quality
          docker image inspect "$SONAR_IMAGE" "$SCANNER_IMAGE" > artifacts/quality/images.json
          docker logs mooc-sonar > artifacts/quality/server.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ github.sha }}
          path: artifacts/quality
          retention-days: 90
      - name: Retirar servidor y credencial efímeros
        if: always()
        run: |
          docker rm -f mooc-sonar || true
          rm -f "$SONAR_ENV_FILE"
