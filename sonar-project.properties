sonar.projectKey=mooc-cloud
sonar.projectName=MOOC Cloud
sonar.sourceEncoding=UTF-8
# Se analiza todo el código de aplicación, incluido shadcn y el worker.
sonar.sources=backend,frontend/src,frontend/vite.config.ts
sonar.tests=backend,frontend/e2e
sonar.test.inclusions=backend/**/*_test.go,frontend/e2e/**/*.spec.ts
sonar.exclusions=backend/**/*_test.go
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.typescript.tsconfigPaths=frontend/tsconfig.json
